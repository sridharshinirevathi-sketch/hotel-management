services:
  - type: web
    name: havenstay
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: havenstay-db
          property: connectionString
      - key: PGSSL
        value: "false"

databases:
  - name: havenstay-db
    databaseName: havenstay
    user: havenstay
    plan: free
